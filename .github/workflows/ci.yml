name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install numpy pandas scikit-learn pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src experiments tools
      - name: Test
        run: python -m pytest
      - name: Validate release artifacts
        run: python tools/validate_repository.py
