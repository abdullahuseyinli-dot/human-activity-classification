name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0 torchvision==0.26.0
      - name: Install project and validation dependencies
        run: python -m pip install -e ".[dev,notebook,report]"
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src experiments tools
      - name: Test
        run: python -m pytest
      - name: Validate release artifacts
        run: python tools/validate_repository.py
      - name: Verify historical release manifest
        run: python tools/build_study_release_manifest.py --check
      - name: Verify current release manifest
        run: python tools/build_v3_release_manifest.py --check
